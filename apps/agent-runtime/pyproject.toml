[project]
name = "arp-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mini-swe-agent~=2.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
arp-runtime = "arp_runtime:main"
arp-eval = "arp_runtime.eval_cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
